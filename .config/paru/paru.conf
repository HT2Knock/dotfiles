# paru configuration. See paru.conf(5).
#
# Sudo points at a wrapper that reads the password through a GUI dialog.
# This lets the OpenCode agent run paru without a terminal.
# Install the wrapper first: scripts/sudo-gui -> /usr/local/bin/sudo-gui

[options]
# SudoLoop is off. With the GUI askpass it opens a second prompt at the same
# time as the main command. A long build asks again when it installs.

[bin]
Sudo = /usr/local/bin/sudo-gui
