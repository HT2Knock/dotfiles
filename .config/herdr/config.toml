onboarding = false

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[keys]
prefix = "ctrl+a"

split_horizontal = "prefix+minus"
split_vertical = "prefix+shift+minus"

switch_workspace = "prefix+shift+1..9"

# Cycle workspace/worktree rows. Up/down matches the vertical sidebar order.
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# Cycle agent panel rows, across workspaces. Left/right pairs with workspace up/down.
previous_agent = "prefix+left"
next_agent = "prefix+right"

open_worktree = "prefix+shift+o"

[ui]
status_indicators = "symbols"

[theme]
name = "tokyo-night"
auto_switch = false

[ui.sound]
enabled = true
