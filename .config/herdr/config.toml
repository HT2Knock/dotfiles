onboarding = false

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[keys]
prefix = "ctrl+a"

split_horizontal = "prefix+minus"
split_vertical = "prefix+shift+minus"

switch_workspace = "prefix+shift+1..9"

# Cycle workspace/worktree rows. Up/down matches the vertical sidebar order.
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

[ui]
status_indicators = "symbols"

[theme]
name = "tokyo-night"
auto_switch = false

[ui.sound]
enabled = true
