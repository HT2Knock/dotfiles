onboarding = false

[ui]
# Create tabs immediately, do not ask for a name (tmux-like).
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[keys]
# tmux: set -g prefix C-a
prefix = "ctrl+a"

# tmux: bind r source-file
reload_config = "prefix+r"

# tmux: bind Enter copy-mode
copy_mode = ["prefix+[", "prefix+enter"]

# tmux: bind - split-window -v (stacked), bind _ split-window -h (side by side)
split_horizontal = "prefix+minus"
split_vertical = "prefix+shift+minus"

# tmux: bind -r h/j/k/l select-pane
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tmux: bind -r H/J/K/L resize-pane
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Free prefix+r and prefix+shift+h/j/k/l for reload and resize.
resize_mode = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""

# tmux: bind Tab last-window
last_pane = "prefix+tab"
cycle_pane_next = ""
