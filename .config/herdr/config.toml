onboarding = false

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[keys]
prefix = "ctrl+a"

split_horizontal = "prefix+minus"
split_vertical = "prefix+shift+minus"

switch_workspace = "prefix+shift+1..9"

[ui]
status_indicators = "symbols"

[theme]
name = "tokyo-night"
auto_switch = false

[ui.sound]
enabled = false
